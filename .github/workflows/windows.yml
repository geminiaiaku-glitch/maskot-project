name: Windows build and core tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Portable Windows x64 build
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Maskot-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Maskot-win-x64
          path: artifacts/win-x64/
      - name: Package portable application
        run: |
          cd artifacts/win-x64
          zip -r ../Maskot-win-x64.zip . -x '*.pdb'
          cd ..
          sha256sum Maskot-win-x64.zip > Maskot-win-x64.zip.sha256
      - name: Publish preview download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/Maskot-win-x64.zip artifacts/Maskot-win-x64.zip.sha256 \
            --verify-tag --prerelease \
            --title "Maskot / Momo — $RELEASE_TAG" \
            --notes-file docs/RELEASE-NOTES.md
